# A generic, single database configuration.

[alembic]
# Path to migration scripts.
script_location = %(here)s/alembic

# Template used to generate migration files.
# file_template = %%(rev)s_%%(slug)s

# Additional Python paths.
prepend_sys_path = .

# Timezone used when generating migration files.
# timezone =

# Maximum length of the "slug" field.
truncate_slug_length = 40

# Revision environment options.
revision_environment = false

# Set to true to search source files recursively for revisions.
recursive_version_locations = false

# Output encoding used for revision files.
output_encoding = utf-8


[post_write_hooks]
# Hooks can be configured here later if needed.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S